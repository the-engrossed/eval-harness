name: deterministic

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (from uv.lock)
        run: make install
      - name: Data (build output, regenerated byte-for-byte)
        run: make data
      - name: Suite file is up to date
        run: git diff --exit-code -- evals/suites/core.json
      - name: Lint, typecheck, tests (no API key, no network)
        run: make check
      - name: Demo (offline, no keys)
        run: make demo
